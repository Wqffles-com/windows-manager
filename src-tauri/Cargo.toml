[package]
name = "windows-manager"
version = "0.1.0"
description = "All-in-one Windows 11 management tool"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Desktop only: "cdylib"/"staticlib" are for Tauri mobile and break MinGW linking
# ("export ordinal too large"). The `_lib` suffix avoids a name clash with the bin on Windows.
name = "wm_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.4"
rayon = "1.12.0"
trash = "5.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
